<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Open-Meteo Studio{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-deep: #070b14;
      --bg-card: rgba(17, 25, 43, 0.78);
      --bg-card-hover: rgba(24, 35, 60, 0.92);
      --bg-input: rgba(9, 14, 26, 0.72);
      --border-glass: rgba(148, 163, 184, 0.16);
      --border-glow: rgba(56, 189, 248, 0.45);
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --accent-cyan: #38bdf8;
      --accent-indigo: #818cf8;
      --accent-emerald: #34d399;
      --accent-rose: #fb7185;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--text-main);
      background-color: var(--bg-deep);
      background-image:
        radial-gradient(circle at 12% 15%, rgba(56, 189, 248, 0.16), transparent 36%),
        radial-gradient(circle at 88% 12%, rgba(129, 140, 248, 0.16), transparent 38%),
        radial-gradient(circle at 50% 95%, rgba(52, 211, 153, 0.08), transparent 45%);
      background-attachment: fixed;
    }

    .mono {
      font-family: 'JetBrains Mono', monospace;
    }

    .glass-nav {
      background: rgba(10, 15, 28, 0.72);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-glass);
    }

    .brand-logo {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #fff !important;
      text-decoration: none;
    }

    .brand-badge {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      font-size: 1rem;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-indigo));
      box-shadow: 0 8px 24px -6px rgba(56, 189, 248, 0.55);
    }

    .nav-pill-link {
      color: var(--text-muted) !important;
      font-weight: 500;
      padding: 8px 14px !important;
      border-radius: 10px;
      transition: all 0.2s ease;
    }

    .nav-pill-link:hover,
    .nav-pill-link.active-link {
      color: #fff !important;
      background: rgba(255, 255, 255, 0.07);
    }

    .glass-card {
      background: var(--bg-card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-glass);
      border-radius: 20px;
      box-shadow: 0 20px 45px -20px rgba(0, 0, 0, 0.65);
      transition: transform 0.22s ease, border-color 0.22s ease, background 0.22s ease, box-shadow 0.22s ease;
    }

    .weather-card:hover {
      transform: translateY(-4px);
      border-color: var(--border-glow);
      background: var(--bg-card-hover);
      box-shadow: 0 24px 50px -22px rgba(56, 189, 248, 0.28);
    }

    .form-control,
    .form-control:focus {
      background-color: var(--bg-input);
      border: 1px solid var(--border-glass);
      color: var(--text-main);
      border-radius: 12px;
    }

    .form-control::placeholder {
      color: #64748b;
    }

    .form-control:focus {
      border-color: var(--accent-cyan);
      box-shadow: 0 0 0 0.2rem rgba(56, 189, 248, 0.18);
    }

    .btn-neon {
      background: linear-gradient(135deg, #0ea5e9, #6366f1);
      border: none;
      color: #fff;
      font-weight: 600;
      border-radius: 12px;
      padding: 10px 18px;
      transition: all 0.2s ease;
      box-shadow: 0 10px 25px -8px rgba(99, 102, 241, 0.6);
    }

    .btn-neon:hover {
      filter: brightness(1.1);
      transform: translateY(-1px);
      color: #fff;
    }

    .btn-save-glow {
      background: linear-gradient(135deg, #10b981, #059669);
      border: none;
      color: #fff;
      font-weight: 600;
      border-radius: 11px;
      transition: all 0.2s ease;
      box-shadow: 0 8px 20px -8px rgba(16, 185, 129, 0.55);
    }

    .btn-save-glow:hover {
      filter: brightness(1.08);
      color: #fff;
    }

    .temp-pill {
      font-size: 1.5rem;
      font-weight: 700;
      background: linear-gradient(135deg, #7dd3fc, #c4b5fd);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .metric-box {
      background: rgba(9, 14, 26, 0.55);
      border: 1px solid rgba(148, 163, 184, 0.1);
      border-radius: 12px;
      padding: 10px 12px;
    }

    .metric-label {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
    }

    .metric-val {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-main);
    }

    .condition-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 11px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 500;
      background: rgba(56, 189, 248, 0.14);
      border: 1px solid rgba(56, 189, 248, 0.28);
      color: #bae6fd;
    }

    .table-glass {
      --bs-table-bg: transparent;
      --bs-table-color: var(--text-main);
      --bs-table-border-color: rgba(148, 163, 184, 0.14);
      --bs-table-hover-bg: rgba(56, 189, 248, 0.06);
      --bs-table-hover-color: #fff;
    }

    .text-muted-custom {
      color: var(--text-muted) !important;
    }
  </style>
</head>
<body>
<nav class="navbar navbar-expand-lg glass-nav sticky-top mb-4">
  <div class="container">
    <a class="brand-logo navbar-brand" href="{{ url_for('index') }}">
      <span class="brand-badge">⛅</span>
      <span>Open-Meteo <span style="color: var(--accent-cyan);">Studio</span></span>
    </a>
    <div class="navbar-nav flex-row gap-2">
      <a class="nav-link nav-pill-link {% if request.endpoint == 'index' %}active-link{% endif %}" href="{{ url_for('index') }}">Пошук</a>
      <a class="nav-link nav-pill-link {% if request.endpoint == 'saved_page' %}active-link{% endif %}" href="{{ url_for('saved_page') }}">Збережені</a>
    </div>
  </div>
</nav>

<main class="container pb-5">
  {% block content %}{% endblock %}
</main>
</body>
</html>
